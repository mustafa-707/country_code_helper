name: country_code_helper
description: Flutter country picker with built-in themed bottom sheet, phone-field prefix, bundled flag assets, SIM detection, and phone number parsing/validation.
version: 0.3.0
repository: https://github.com/mustafa-707/country_code_helper
issue_tracker: https://github.com/mustafa-707/country_code_helper/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  phone_numbers_parser: ^9.0.22
  dartarabic: ^0.3.1

flutter:
  uses-material-design: true
  assets:
    - flags/
