name: example
description: country_code_helper example app.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  country_code_helper:
    path: ../
  # Optional: app-level plugin used by the example to demo SIM-based region
  # detection. The country_code_helper package itself does NOT depend on this.
  sim_card_code: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
